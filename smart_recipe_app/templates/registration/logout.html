{% extends "base_html" %}
{% load static %}

{% block title %}Logged Out{% endblock %}

{% block extra_css %}
<style>
    a {
        color: #28a745; 
    }
    a:hover { 
        color: #1e7e34;
    }
</style>
{% endblock %}

{% block content %}

<div class="small-container text-center">
    <h3 class="text-green mb-3">You have been logged out</h3>

    <p class="mb-4">
        Want to sign back in?
    </p>

    <a href="{% url 'login' %}" class="btn btn-green w-100">Login again</a>
</div>

{% endblock %}
