<!-- ========== CONFIRM DELETE (confirm_delete.html) ========== -->
{% extends "common/base.html" %}

{% block title %}Confirm Delete{% endblock %}

{% block extra_css %}
<style>
    .delete-container {
        max-width: 500px;
        margin: 80px auto;
        padding: 0 20px;
    }

    .delete-card {
        background: white;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .delete-icon {
        width: 56px;
        height: 56px;
        background: #ffe6e6;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        color: #091057;
        font-size: 28px;
    }

    .delete-title {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 16px;
        text-align: center;
    }

    .delete-subtitle {
        font-size: 15px;
        color: var(--text-muted);
        text-align: center;
        line-height: 1.6;
        margin-bottom: 32px;
    }

    .object-name {
        color: var(--text-dark);
        font-weight: 600;
    }

    .delete-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
    }

    .btn-cancel-delete {
        background: white;
        color: var(--text-dark);
        border: 2px solid #e8e8e8;
        padding: 14px 32px;
        border-radius: 50px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        font-size: 15px;
        display: inline-block;
    }

    .btn-cancel-delete:hover {
        background: #f5f5f5;
        border-color: #d0d0d0;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .btn-confirm-delete {
        background: #FF5555;
        color: white;
        border: none;
        padding: 14px 32px;
        border-radius: 50px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 15px;
    }

    .btn-confirm-delete:hover {
        background: #FF937E;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(9, 16, 87, 0.25);
    }

    @media (max-width: 576px) {
        .delete-actions {
            flex-direction: column-reverse;
        }

        .btn-cancel-delete,
        .btn-confirm-delete {
            width: 100%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="delete-container">
    <div class="delete-card">
        <div class="delete-icon">
            <i class="bi bi-exclamation-triangle"></i>
        </div>

        <h1 class="delete-title">Delete {{ object_type }}</h1>

        <p class="delete-subtitle">
            Are you sure you would like to delete the {{ object_type|lower }} '<span class="object-name">{{ object_name }}</span>'?
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="delete-actions">
                <a href="{{ cancel_url }}" class="btn-cancel-delete">Cancel</a>
                <button type="submit" class="btn-confirm-delete">Yes, Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
