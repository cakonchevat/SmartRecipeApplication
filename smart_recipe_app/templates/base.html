{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}My App{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">


    <!-- Your global styles -->
    <link rel="stylesheet" href="{% static 'smart_recipe_app/theme.css' %}">
    {% block extra_css %}{% endblock %}
</head>

<body>
{% if user.is_authenticated %}
<div class="d-flex">
    <!--Sidebar-->

    <div class="sidebar d-flex flex-column border-end shadow-sm">
        <h4 class="text-center py-3 fw-bold">Smart Recipe App</h4>
    <hr>

        <ul class="nav flex-column px-2 h-100">
            <li class="nav-item">
                <a class="nav-link" href="{% url 'pantry' %}">
                    <i class="bi bi-archive me-2"></i></i>Pantry</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'wishlist' %}">
                    <i class="bi bi-heart me-2"></i>Wishlist</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'daily_plans' %}">
                    <i class="bi bi-calendar-week me-2"></i>Daily Plans</a>
            </li>

                <li class="logout mt-auto">
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button class="btn" >
                            <i class="bi bi-arrow-bar-right"></i>  Logout</button>
                    </form>
                </li>

        </ul>

    </div>
    {% endif %}
    <!--Main content-->
    <div class="modal-content flex-grow-1 p-4">
        {% block content %}
        {% endblock %}
    </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
